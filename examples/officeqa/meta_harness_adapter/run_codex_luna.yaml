# OfficeQA with the Meta-Harness Adapter Evolver on the Flash row with GPT-5.6-Luna (the README's second column):
# run.yaml with the models changed and nothing else of the protocol (the 50 training questions as the search set, six
# proposal rounds of k = 2, thirteen epochs, `deploy: adapter`, 3,600 s sessions, one test pass). The acting model is
# Codex's built-in provider on the machine's ChatGPT login (backend codexplan: no API key; each session gets a fresh
# copy of the login, ../utils/agent/codex_login.py), in the image with the machine's standalone Codex
# (OFFICEQA_CODEX_IMAGE=officeqa-codex:0.164.0) behind the egress proxy that lets through chatgpt.com only
# (OFFICEQA_CODEX_PROXY=http://oq-egress-chatgpt:3128). The proposer is a Codex session with the same model on the same
# login in hermit's sandbox, reaching chatgpt.com through the run's allowlist proxy.
backends:
  codexplan: {base_url: "https://chatgpt.com/backend-api/codex", key_required: false, api_key_env: null, apis: [chat, responses]}
data:
  tasks: ../utils/tasks.jsonl
  train: ../utils/splits/train.txt     # the search set
  test: ../utils/splits/test.txt
  step_size: 50                        # the whole search set per step: each step evaluates one candidate
  shuffle: false
task_info: task-info/
agent:
  name: ../utils/agent/codex_agent.py:OfficeQACodexAgent
  concurrency: 8
  params:
    model: codexplan/gpt-5.6-luna      # a backend at ChatGPT's Codex endpoint: the session runs on the login
    effort: medium
    timeout_s: 3600
    codex_dir: ~/.cache/hermit/officeqa-mh-codex-luna
    deploy: adapter                    # ADAPTER.md as AGENTS.md, every other adapter file in the workspace
judge:
  path: ../utils/judge.py
template: meta-harness-adapter@1.0
start_from: seed_adapter               # make_seed.py writes it from ../utils/seed_adapter
evolver:
  name: meta_harness_adapter
  params:
    model: gpt-5.6-luna                # the proposer: Codex's built-in provider on the login (home)
    args: ["-c", 'model_reasoning_effort="medium"', "-c", 'forced_login_method="chatgpt"',
           "-c", 'cli_auth_credentials_store="file"', "-c", 'web_search="disabled"',
           "-c", "check_for_update_on_startup=false", "-c", "features.apps=false", "-c", "features.plugins=false",
           "-c", "features.remote_plugin=false", "-c", "features.browser_use=false",
           "-c", "features.browser_use_external=false", "-c", "features.computer_use=false",
           "-c", "features.in_app_browser=false"]
    home: [auth.json]                  # a copy of the machine's login, removed by finalize
    k: 2
    max_rounds: 6                      # six rounds of two: twelve candidates, each evaluated once
sandbox:
  enabled: true
  network: restricted
  allow: [chatgpt.com]                 # the proposer's sessions reach the login's backend, nothing else
  read: [../utils/documents]           # the proposer may read the corpus the agent searches (read only)
  env: []
  profiles:                  # the agent's role runs unconfined: it drives Docker (the daemon's socket, the sessions'
    rollout: {enabled: false}   # homes under ~/.cache); each Codex session is in a container of its own (codex_session.py)
trainer:
  run_name: luna-mh
  output_dir: runs
  tree_dir: runs/trees/luna-mh
  epochs: 13                           # the seed, then twelve candidates
  budget: {usd: null, tokens: null, hours: null}   # the plan has no price per token: nothing to cap in USD
  call_timeout_min: 120                # the proposer's session and its checks
eval:
  repeats: 1
