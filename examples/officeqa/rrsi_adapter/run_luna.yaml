# OfficeQA with the RRSI Adapter Evolver on the Flash row with GPT-5.6-Luna (the README's second column): Codex 0.164.0
# with GPT-5.6-Luna at medium effort acting AND learning on the machine's ChatGPT login (a Codex plan; no API key).
# The evolve set is the 50 training questions with k = 2 trials each (make_rows.py: rows `<id>#<k>`, which the agent
# and judge wrappers in trials.py map back to the question); a step's 100 rollouts evaluate one candidate. H_0 is
# SkillOpt's initial skill (make_seed.py). The acting agent is ../utils/agent/codex_agent.py with `deploy: adapter`,
# Meta-Harness Adapter's deployment (ADAPTER.md as AGENTS.md, every other adapter file in the session's directory), in
# a container per question (OFFICEQA_CODEX_IMAGE=officeqa-codex:0.164.0, OFFICEQA_CODEX_PROXY=
# http://oq-egress-chatgpt:3128: the recipe's "A model on a ChatGPT login"). The proposer and the one-call roles
# (analyst, digesters, critic) are Codex sessions on the same login in hermit's sandbox, reaching chatgpt.com only
# through the run's allowlist proxy (no session can refresh, and so rotate, the machine's login). RRSI's
# hyperparameters: rrsi.json (T = 10 rounds of m = 2). After the run, `hermit eval` scores H_T once on the 172 test
# questions; `hermit eval --config run_luna.yaml --adapter seed_adapter` scores H_0 the same way.
backends:
  codexplan: {base_url: "https://chatgpt.com/backend-api/codex", key_required: false, api_key_env: null, apis: [chat, responses]}
data:
  tasks: rows/tasks.jsonl              # make_rows.py: ../utils/tasks.jsonl plus k trial rows per training question
  train: rows/train_k2.txt             # the evolve set: 50 questions x k = 2
  test: ../utils/splits/test.txt
  step_size: 100                       # the whole evolve set per step: each step evaluates one candidate
  shuffle: false
task_info: task-info/
agent:
  name: trials.py:TrialCodexAgent
  concurrency: 10
  params:
    model: codexplan/gpt-5.6-luna      # a backend at ChatGPT's Codex endpoint: the session runs on the login
    effort: medium
    timeout_s: 3600                    # one session's wall clock, as the Meta-Harness Adapter and stream runs
    codex_dir: ~/.cache/hermit/officeqa-rrsi-codex-luna
    deploy: adapter                    # ADAPTER.md as AGENTS.md, every other adapter file in the workspace
judge:
  path: trials.py                      # ../utils/judge.py on the row's question
template: rrsi-adapter@1.0
start_from: seed_adapter               # make_seed.py writes it from ../utils/seed_adapter
evolver:
  name: rrsi_adapter
  params:
    model: gpt-5.6-luna                # the proposer and the roles: Codex's built-in provider on the login (home)
    args: ["-c", 'model_reasoning_effort="medium"', "-c", 'forced_login_method="chatgpt"',
           "-c", 'cli_auth_credentials_store="file"', "-c", 'web_search="disabled"',
           "-c", "check_for_update_on_startup=false", "-c", "features.apps=false", "-c", "features.plugins=false",
           "-c", "features.remote_plugin=false", "-c", "features.browser_use=false",
           "-c", "features.browser_use_external=false", "-c", "features.computer_use=false",
           "-c", "features.in_app_browser=false"]
    home: [auth.json]                  # a copy of the machine's login, removed by finalize
    domain: domain.py:OfficeQADomain
    rrsi: rrsi.json
    role_timeout_s: 1800
sandbox:
  enabled: true
  network: restricted
  allow: [chatgpt.com]                 # the proposer's and the roles' sessions reach the login's backend, nothing else
  read: []
  env: []
  profiles:                  # the agent's role runs unconfined: it drives Docker (the daemon's socket, the sessions'
    rollout: {enabled: false}   # homes under ~/.cache); each Codex session is in a container of its own (codex_session.py)
trainer:
  run_name: luna-rrsi
  output_dir: runs
  tree_dir: runs/trees/luna-rrsi
  epochs: 30                           # at most 1 + T x m = 21 evaluations, with room for a failed step; the Evolver
                                       # ends the run after round T-1
  allow_early_stop: true
  call_timeout_min: 360                # a round's analysis, two proposer sessions with repairs, the critic and the smokes
  budget: {usd: null, tokens: null, hours: null}   # the plan has no price per token: nothing to cap in USD
eval:
  repeats: 1                           # one pass over the test questions
